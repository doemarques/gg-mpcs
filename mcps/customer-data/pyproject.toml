[project]
name = "customer-data"
version = "1.2.0"
description = "Customer data MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.6",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
customer-data = "customer_data:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
