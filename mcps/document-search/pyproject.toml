[project]
name = "document-search"
version = "2.0.1"
description = "Document search MCP server"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.6",
    "mcp[cli]>=2.3.0",
]

[project.scripts]
document-search = "document_search:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
